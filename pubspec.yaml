name: expense_track
description: Personal Expense Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^1.2.0

  # Unique IDs
  uuid: ^4.4.0

  # Date/number formatting
  intl: ^0.19.0

  # Icons (optional, already in Flutter)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Hive code generator
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true